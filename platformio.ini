; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328new

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = https://github.com/sensorium/Mozzi.git#1.1.2
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200 
; same firmware for a Nano with the old bootloader (uploads at 57600 baud)
; pio run -e oldbootloader -t upload
[env:oldbootloader]
extends = env:nanoatmega328new
board = nanoatmega328

; hardware test: walks a single pixel over the LED matrix, row by row
; pio run -e displaytest -t upload
[env:displaytest]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = https://github.com/sensorium/Mozzi.git#1.1.2
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200
build_flags = -DDISPLAY_TEST
build_src_filter = -<*> +<LedMatrix.cpp> +<DisplayTest.cpp>
